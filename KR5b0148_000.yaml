front:
  text: 齊戒籙弔七夫入靖修真要資齊戒檢口愼過其道漸階南華真經云顔回問道於孔子孔子曰汝齊戒吾將語汝顔回曰回居貧唯不飲酒不茹葷久矣孔子曰是祭祀之齊非心齊也汝一志無以耳聽而以心聽無以心聽而以氣聽疏瀹汝心志澡雪汝精神掊繫汝智慮我將語汝夫道冥然難言哉將為汝試言其約略爾混元皇帝聖紀云按諸經齊法略有三種一者設供齊以積德解愆二者節食齊可以和神保壽斯謂祭祀之齊中士所行也三者心齊謂疏瀹其心除嗜欲也澡雪精神去穢纍也掊擊其智絶思慮也夫無思無慮則專道無嗜無欲則樂道無穢無纍則合道既心無二想故曰一志焉蓋上士所行也夫齊者齊也齊整三業乃為齊矣若空守節食既心識未齊又唯存一志則口無貪味謂茲二法表裏相資大戒經云夷心靜默專想不二過中不味內外清虛是也子雖簿間節食未解調心故示齊法令其受道而末學之徒孰能虛心一志哉夫鄙乎祭祀之教自謂得心齊之理蓋嗊嗃怠慢之失矣雖口談空寂無解其目是自矜也
