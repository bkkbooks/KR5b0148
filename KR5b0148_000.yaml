body:
  text: 洞玄靈寶六齊十直道教五戒一者不得殺生二者不得嗜酒三者不得口是心非四者不得偷盜五者不得淫色十善一念孝順父母二念忠事君師三念慈心萬物四念忍性容非五念諌諍蠲惡六念損己救窮七念放生養物種諸果林八念道邉舍井種樹立橋九念為人興利除害教化未悟十念讀三寶經律𢘆奉香花供養之具凡人常行此五戒十善𢘆有天人善神衛之永滅災殃長臻福祐唯在堅志年六齊正月三月五月七月九月十一月月十齊一日北斗下八曰北斗司殺君下十四日太一使者下十五日天帝及三官俱下十八日天一下二十三日太一八神使者下二十四日北辰下二十八日下太一下二十九日中太一下三十曰上太一下自下中上三太一下日皆天地水三官一切尊神俱下周行天下伺人善惡甲子日太一簡閲神祇庚申日伏尸言人罪過本命日計人功行八節日有八神記人善惡三元日天地水官校人之罪福六種齊第一道門大論云上清齊有三法一者絶羣獨宴靜氣遺形二者清壇肅侣依大真儀格三者心齊謂疏倫其心澡雪精神弟二靈寶齊有六法一者金籙齊保鎮國土二者黃籙齊救世祖宗三者明真齊懴悔九幽四者三元齊首謝違犯科戒五者八節齊懴洗宿新之過六者自然齊為百姓祈福第三洞神齊精簡為上絶塵期靈第四太一齊以恭肅為首第五指教齊以清素為貴第六塗炭齊以勤苦為功巳上諸齊自古及今登壇告盟啓誓玄聖或三曰七日九日十五日皆晝夜六時行道轉經禮懴儀格甚重除上清絶羣獨宴靜氣遺形心齊之外自餘皆是為國王民人學真道士拔度先祖己躬謝過禳災致福之齊此時移代同異不無詳略於靈寶齊中為半景之齊既無宿請亦無言功唯只一時或兩時懴悔亦不三時上香步虛禮經並闕或小小齊中三禮歎願隨時去取逐便制儀既非大集心達而巳二種齊本相經曰齊有二種一則拯道二則濟度拯道者謂發心學道從初至終念念持齊心心不退復有二門一謂志心二謂滅心志心者始終運意行坐動形寂若死灰同於枯木滅諸想念唯一而巳滅心者隨念隨忘神行不係歸心於寂直至道場濟度者謂回心至道翹想玄真願福降無窮災消未兆又云䖍心者唯罄一心丹誠十極燒香禮拜唯求於道捨財者巿諸香油八珍百味營饌供具屈請道士及以凡器歸心啓告委命至真內泯六塵外齊萬境冥心靜慮歸神於道克成道果永契無為救濟存亡撥度災苦隨其分力福降不差功德輕重各在時矣十二齊玄門大論一者金籙齊上消天災保鎮帝王簡文亦云兼為師友二者玉籙齊宗云正為人民今此本未行於世三者黃籙齊拯拔地獄罪根開度九幽七祖四者上清齊求仙念真錬形隱景五者明真齊學士自拔億曾萬祖長夜之魂六音指教齊諸福謝罪禳災救疾七者塗炭齊拔罪謝殃請福度命八者三元齊學士已身悔罪九者八節齊學士謝過求仙十者三皇子午齊輔助帝王保安國界十一者靖齊如千日百日三日七日修真之用十二者自然齊救度一切存亡自然之中修行時節八節齊凡八節之日是上天八會大慶之日也其日諸天大聖尊神上會靈寶玄都玉京上宫朝慶天真奉戒持齊遊行誦經此日修齊持戒宗奉天文者皆為五帝所舉書名玉曆心齊南華真經曰顔淵問道於孔子孔子曰汝齊戒吾將告汝顔淵曰回貧唯不飮酒不茹葷久矣孔子曰是祭祀之齊非心齊也汝一志無以耳聽而以心聽無以心聽而以氣聽疏瀹汝心除嗜欲也澡雪汝精神去穢纍也掊擊其智絶思慮也夫無思無慮則專道無嗜無欲則樂道無穢無纍則合道既心無二想故曰一志齊直三天內解經曰夫為學道莫先乎齊外則不染塵垢內則五藏清虛降真致神與道合居能修長齊者則道合真不犯禁戒也故天師遺教為學不修齊直冥如夜行不持火燭此齊直應是學道之首夫欲啓靈告冥建立齊直者冝先散齊不使宿穢臰腥消除肌體清潔無有沾汙然後可得入齊不爾徒加洗沐見穢在肌膚之內湯水亦不能除三元齊品曰建齊之日當輸金真玉光九天之信置於五帝以招神致靈三元齊品曰學法未備即俯仰之格多不合儀金鎖流珠經曰古來呼齊曰社㑹今攺為齊㑹太上太真科經曰消遣世務三業為修齊存三守一齊為本墓齊者齊也潔也淨也不必六時行道三時講誦晝夜存念懴悔請福干噪玄虛更失萬一能得一者心攝三業能攝身者端拱不擾能攝口者默識密明能攝心者神與道合如斯為主成聖真仙未合此者攝身朝禮離殺盜淫攝口誦經免妄言綺語兩舌罵詈攝心存神脫貪恚癡十惡既去十善自來去來至極與道合真釋齊有九食法玄門大論云齊法大略有九一者粗食二者蔬食三者節食四者服精五者服牙六者服光七者服氣八者服元氣九者胎食粗食者麻麥也蔬食者菜茹也節食者中食也服精者符水及丹英也服牙者五方雲牙也服光者日月七元三光也服氣者六覺之氣太和四方之妙氣也服元氣者一切所禀三元之氣太和之精在乎太虛也胎食者我自所得元精之和為胞胎之元即清虛降四體之氣不復關外也粗食止諸耽嗜蔬食棄諸肥腯節食除煩濁服精其身神體成英帶服牙變為牙服光化為光服六氣化為六氣遊乎十方服元氣化為元氣與天地合為體服胎氣久為嬰童與道混合為一也此之變化運運攺易不復待捨身而更受身往來死生也今意方法未必止是食事其或是方藥或按摩等事可尋也說雜齊法三元品戒經云正月七日天地水三官檢校之日可修齊聖紀云正月七日名舉遷賞會齊七月七日名慶生中會齊十月五日名建生大會齊三官考核功過依日齊戒呈章賞會可祈景福明真科云正月三月五月七月九月十一月一歲六齊月能修齊上三天帝令太一使者除人十苦八道祕言云正月三月四月六月七月八月九月十月十一月此九真齊月一月十五日二十九日此月中三齊日正月一日名天臘五月五日名地臘七月七日名道德臘十月一日名民歲臘十二月節日名侯王臘此五臘日並冝修齊并祭祀先祖明真科云月一日初八日十四日十五日十八日二十三日二十四日二十八日二十九日三十日己上為十直齊日庚申甲子八節太一八神下司察人過咎修齊太一歡恱庚申日人身中伏尸上天言人罪過本命日受法人身神吏兵上天計人功過三洞奉道科云正旦為獻壽齊七日為延神齊二月八日為芳春齊四月八日為啓夏齊五月五日為續命齊六月六日為清署齊七月七日為迎秋齊八月一日為遂邪齊九月九日為延𥮅齊十月一日為成福齊十一月十五日為啓福齊十二月臘日為百福齊二十八日為迎新齊立春為建善齊春分為延福齊立夏為長善齊夏至為朱明齊立秋為遐齡齊秋分為謝罪齊立冬為遵善齊冬至為廣慶齊如此等齊各具本經儀格故學道不修齊戒徒勞山林矣夫齊者正以清虛恬靜謙卑恭敬戰戰兢兢如履氷谷若對嚴君丹誠謙若必祈靈應檢勑內外無使喧雜行齊之人特忌斬衰孝子新産婦人月信未斷及痎瘧瘡疥廢疾等並不得升齊堂庭壇驅使如願苦求預齊乞解過咎者任投辭為其陳懺悔謝不得雜登堂宇應行法事等仍遷令別坐兼忌六畜蓋此等人穢觸真靈賢聖不降乃修齊無功也凡修齊主䖍誠齊官整肅至如香燈不備亦曰踈遺啓聖祈真莫先於此香貴在沉水栴檀依上清香珠丸合和不得用甲麝招真致靈務存精志如寒棲學真道士修齊單貧不可致者亦冝以少為信無令頓闕若純以乳頭非道家所用也初登齊靖看焚香氣向東南西北直上者五帝依向而至登真隱訣云香者天真用茲以通感地祇緣斯以達信非論齊潔祈念存思必燒香左右侍香金童必為招真達意登真隱訣云真人攝日暉以通照役月精以朗幽故然九光之微燈晃八方之盡夜四極明科云立春春分然九燈於庭立夏夏至然八燈立秋秋分然六燈立冬冬至然五燈本命日十二燈自此陳乞謝過祈恩用燈於庭法與修諸齊自有燈數於庭訖依記四時向王唯本命向太歲叩齒二十四通呪曰髙上太真萬聖帝皇五帝玉司總仙監真今日吉辰八節開陳陽罪隂考絶滅九隂於今永始拔釋七玄免脫火鄉永離刀山三塗五苦不纍我身得同天地長保帝晨五願八㑹靡不如言呪畢解巾叩頭百二十過當今額向地而巳勿令痛竟復巾仰天心念我身今日上享天恩賜反形骸受生飛仙畢仰咽二十四氣止如此三年宿𠎝並除身與真同案諸經齊法略有三種一者設供齊可以積德解愆二者節食齊可以和神保壽斯謂祭祀之齊中士所行也三音心齊謂疏瀹其心除嗜欲也澡雪精神去穢纍也棓擊其智絶思慮也夫無思無慮則專道無嗜無欲則樂道無穢無纍則合道既心無二想故曰一志焉蓋上士所行也詳矣齊者齊也要以齊整三業乃為齊矣若空守節食既心識未齊又唯在一志則口無貪味之謂也二法表裏相資故大戒經云夷心靜默專想不二過中不味內外清虛是也子雖薄間節食未解調心故云茲齊法令其受道而末學之徒孰能虛心一志哉夫鄙乎祭祀之教自謂得心齊之理蓋怠慢之失矣雖口談寂無解其目是自矜焉易云聖入以此齊戒齊科道士王纂金壇人也居馬跡山常以隂功救物仁逮蠢動值晉之末中原亂罹饑饉既臻疫癘仍作時有毒瘴損斃者多閭里凋荒死亡枕藉纂於靜室飛章告玄三夕之中繼之以泣至三夜有光如晝照其家庭即有祥風景雲紛郁空際俄而異香天樂下集庭中介金執鋭之士三十餘人羅列如有所候頃之珠幢寶蓋霓斾羽節紅旌錦旗各二人相對前行節最後又有四青童執花捧香侍女捧按地鋪錦席前立巨屏左右龍虎將軍侍從官將兵士二千許人立兩面若有備衛焉復有金甲大將軍二十六人神王十人次龍虎二君之外班列肅如也須㬰笙簫駭空自西北而至五色竒花灼爍𧰟逸一人佩劒持版而前告纂曰太上道君至矣於是百寶大座自空而下太上道君侍二真人二天帝在座之左右道君坐五色蓮花二真二帝立侍焉纂拜首迎謁跪伏於地道君曰子慜念生民形于章醮刳心瀝血感動幽明地司列名蓋化育萬物而五行為之用五行互有相勝各有興衰代謝推遷間不容息是以生之不停氣氣相續億劫巳來未暫輟也得其生者合於純陽升天而為仙得其死者瀹于至隂在地而為鬼鬼物之中自有優劣强弱剛柔善惡與人世無異玉皇天尊慮鬼神之肆橫害於人也常命五帝三官檢制部御之律令刑章罔不明備而季世之民澆僞者衆淳源既散祅詐萌生不忠於君不孝於家廢三綱五常之教自投死地由是六天故氣魔鬼之徒與歷代已來敗軍死將聚結為黨伐害生民駕雨乘風因衰伺隙為種種病中傷甚多亦有不終天年罹其夭枉者尋於杜陽宮出神呪經授真人唐平使其流布以救於物民間有之世人見王翦白起名謂為虛誕此蓋從來將領生為兵統死為鬼帥有功者遷為隂官殘害者猶居魔屬乘五行敗氣為瘵為瘥然以陽威憚之神呪服乏自當彌戢矣今以神化神呪二經復授於子按而行之以拯護萬民兆庶也即命侍童披九光之韞以神化經及三五大齊訣授之於纂曰勉而勤之隂功克克真階可冀也言訖千乘萬騎西北而舉升遷上清矣纂案經品齊科行於江表疫毒銷彌生靈乂康自晉及茲普蒙其福者不可勝紀焉持齊無上祕要云昔有道士持齊誦經有一凡人為賃作治廚齊堂道士見其用意至日中持齊因喚與同食食竟為其說法語此賃人今隨吾持齊功德甚大可至明日中時復食勿壞爾齊徒勞無益能如此者將可得免見世窮厄此人稽首受戒而去暮還家其婦一日待壻具以道士戒言喻婦婦甚不解遂致嗔怒賃人不能免其婦意遂壞其齊與婦共食其後命過天使其人主蜀山千歲樹精𢘆給其中食其樹茂盛暑夏之月有精進賢者三人經過依樹而思賢者歎曰此樹雖凉日已向中何由得食此人於樹人曰當為賢者供設中食無所為憂須㬰食至賢者共食食竟言曰我覔道道在何所此自然非道也因問樹曰不審大神可得暫降形見與某相面否此人於樹空中答曰我非能使人得道者也具記姓字處所昔常為道士勸使持齊為婦人所壞功德不全致令使我守此樹精不能得出天以我昔經齊中食今每至中給我齊食口不暇食又無緣得遷欲屈賢者為至我舍道我如此能為我建三日齊戒我身便得升天賢者感此人意為尋其家具以其言語家人如此家人即為䢖齊請諸道士燒香誦經三日謝過此人即得飛行升入雲中於景霄之上受書為散仙人故齊之功德甚重不可不修此人半日持齊死經一日即時出身不拘一年而得為仙故天計功過明之不𧇊也夫為學者可勤持齊戒以期冥感能修之者必獲升騰之舉隂陽雜齊曰三會日正月七日舉遷賞會齊七月七日慶生中會齊十月五日建生大會齊三會日三官考核功過宜受符籙齊戒呈章以祈景福五臘日正月一日名天臘齊五月五日名地臘齊七月七日名道德臘齊十月一日名民歲臘齊十二月節日名俠王臘齊五臘日常當祠獻先亡名為孝子得福無量餘日皆是淫祀通前三元日為八解日皆可設淨供求福焉明真科云甲子日夜半時甲戌日黃昏時巳上天皇真官下日甲申日晡時甲午日日中時巳上地皇真官下日甲辰日食時甲寅日平旦時巳上人皇真官下日右其日修齊五嶽四瀆神君各依方位紏察善惡無不上聞又丁卯日日出時丁丑時雞鳴時巳上天皇真官下日又丁酉日日入時丁亥日人定時巳上地皇真官下日又丁未日日昳時丁巳日禺中時巳上人皇真官下日其日修齊五嶽真人各遣五神營衛記名仙籙齊戒籙終
